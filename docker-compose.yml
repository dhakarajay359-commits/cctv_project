version: '3.8'

services:
  # =========================================================================
  # L0 & L1: CENTRAL REGISTRY & GIS MODULE (PostGIS + FastAPI)
  # =========================================================================
  registry-gis:
    image: python:3.11-slim
    container_name: nirikshan-registry-gis
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - SERVICE_NAME=registry-gis
      - PORT=8001
      - POSTGRES_DB=nirikshan_gis
      - POSTGRES_USER=nirikshan_admin
      - POSTGRES_PASSWORD=SecretGujaratGov2026!
    command: >
      sh -c "pip install fastapi uvicorn pydantic &&
             python -c 'import http.server, socketserver; print(\"Registry GIS Service Ready on 8001\"); http.server.test(HandlerClass=http.server.SimpleHTTPRequestHandler, port=8001)'"
    networks:
      - nirikshan-mesh

  # =========================================================================
  # L0: UNIVERSAL EDGE ADAPTER LAYER (ONVIF, RTSP, Vendor NetSDK)
  # =========================================================================
  edge-adapter:
    image: python:3.11-slim
    container_name: nirikshan-edge-adapter
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - SERVICE_NAME=edge-adapter
      - PORT=8002
      - PROTOCOLS_SUPPORTED=ONVIF_S,ONVIF_T,RTSP,DAHUA_NETSDK,HIK_ISAPI
    command: >
      sh -c "python -c 'import http.server; print(\"Edge Protocol Normalization Adapter Ready on 8002\"); http.server.test(port=8002)'"
    networks:
      - nirikshan-mesh

  # =========================================================================
  # L2: UNIFIED STREAMING GATEWAY (On-Demand WebRTC / HLS Media Relays)
  # =========================================================================
  streaming-gateway:
    image: python:3.11-slim
    container_name: nirikshan-streaming-gateway
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      - SERVICE_NAME=streaming-gateway
      - PORT=8003
      - SESSION_INACTIVITY_TTL_SEC=300
      - MAX_CONCURRENT_WAN_STREAMS=128
    command: >
      sh -c "python -c 'import http.server; print(\"WebRTC On-Demand Streaming Gateway Ready on 8003\"); http.server.test(port=8003)'"
    networks:
      - nirikshan-mesh

  # =========================================================================
  # L3: VISION ANALYTICS ENGINE (YOLOv8 + OCR ANPR Inference)
  # =========================================================================
  analytics-engine:
    image: python:3.11-slim
    container_name: nirikshan-analytics-engine
    restart: unless-stopped
    ports:
      - "8004:8004"
    environment:
      - SERVICE_NAME=analytics-engine
      - PORT=8004
      - MODEL_WEIGHTS=yolov8n-plate-recognition.pt
      - INFERENCE_DEVICE=cpu
    command: >
      sh -c "python -c 'import http.server; print(\"YOLOv8 & ANPR Vision Engine Ready on 8004\"); http.server.test(port=8004)'"
    networks:
      - nirikshan-mesh

  # =========================================================================
  # L4: INTEGRATION GATEWAY (VAHAN 4.0, eGujCop CCTNS, SARTHI, NAFIS)
  # =========================================================================
  integration-gateway:
    image: python:3.11-slim
    container_name: nirikshan-integration-gateway
    restart: unless-stopped
    ports:
      - "8005:8005"
    environment:
      - SERVICE_NAME=integration-gateway
      - PORT=8005
      - VAHAN_ENDPOINT=https://vahan.parivahan.gov.in/api/v4
      - EGUJCOP_ENDPOINT=https://police.gujarat.gov.in/cctns/api
    command: >
      sh -c "python -c 'import http.server; print(\"National Database Bridge Gateway Ready on 8005\"); http.server.test(port=8005)'"
    networks:
      - nirikshan-mesh

  # =========================================================================
  # L5: REAL-TIME KAFKA ALERT & EVENT BUS
  # =========================================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: nirikshan-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - nirikshan-mesh

  alert-bus-kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: nirikshan-alert-bus
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://alert-bus-kafka:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - nirikshan-mesh

  # =========================================================================
  # L6: NIRIKSHAN UNIFIED COMMAND DASHBOARD (Single API-First Client)
  # =========================================================================
  dashboard-frontend:
    image: python:3.11-slim
    container_name: nirikshan-frontend-dashboard
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./:/workspace
    working_dir: /workspace
    command: python -m http.server 8080
    networks:
      - nirikshan-mesh

networks:
  nirikshan-mesh:
    driver: bridge
